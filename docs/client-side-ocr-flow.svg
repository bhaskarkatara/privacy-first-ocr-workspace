<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 400" role="img">
<title>Client-side OCR flow</title>
<desc>Four browser steps in a row show OCR happening entirely client-side. Below, a fork splits into copy (stays in browser) or save (crosses trust boundary to backend, sending only text).</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #3d3d3a; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0F6E56; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #712B13; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    text { fill: #c2c0b6; }
    .c-purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple .th { fill: #EEEDFE; }
    .c-purple .ts { fill: #CECBF6; }
    .c-teal rect { fill: #085041; stroke: #5DCAA5; }
    .c-teal .th { fill: #E1F5EE; }
    .c-teal .ts { fill: #9FE1CB; }
    .c-coral rect { fill: #712B13; stroke: #F0997B; }
    .c-coral .th { fill: #FAECE7; }
    .c-gray rect { fill: #444441; stroke: #B4B2A9; }
    .c-gray .th { fill: #F1EFE8; }
    .c-gray .ts { fill: #D3D1C7; }
    .arr { stroke: #9c9a92; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="c-purple">
  <rect x="40" y="40" width="140" height="64" rx="6" stroke-width="0.5"/>
  <text class="th" x="110" y="64" text-anchor="middle" dominant-baseline="central">1. Pick image</text>
  <text class="ts" x="110" y="84" text-anchor="middle" dominant-baseline="central">JPG or PNG</text>
</g>
<g class="c-purple">
  <rect x="200" y="40" width="140" height="64" rx="6" stroke-width="0.5"/>
  <text class="th" x="270" y="64" text-anchor="middle" dominant-baseline="central">2. In memory</text>
  <text class="ts" x="270" y="84" text-anchor="middle" dominant-baseline="central">ArrayBuffer local</text>
</g>
<g class="c-purple">
  <rect x="360" y="40" width="140" height="64" rx="6" stroke-width="0.5"/>
  <text class="th" x="430" y="64" text-anchor="middle" dominant-baseline="central">3. Web Worker</text>
  <text class="ts" x="430" y="84" text-anchor="middle" dominant-baseline="central">Tesseract.js OCR</text>
</g>
<g class="c-purple">
  <rect x="520" y="40" width="140" height="64" rx="6" stroke-width="0.5"/>
  <text class="th" x="590" y="64" text-anchor="middle" dominant-baseline="central">4. Text ready</text>
  <text class="ts" x="590" y="84" text-anchor="middle" dominant-baseline="central">Shown in UI</text>
</g>

<line x1="180" y1="72" x2="198" y2="72" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="72" x2="358" y2="72" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="72" x2="518" y2="72" class="arr" marker-end="url(#arrow)"/>

<path d="M 590 104 L 590 140 L 140 140 L 140 176" class="arr" marker-end="url(#arrow)"/>
<path d="M 590 104 L 590 176" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
  <rect x="40" y="176" width="200" height="64" rx="6" stroke-width="0.5"/>
  <text class="th" x="140" y="200" text-anchor="middle" dominant-baseline="central">Copy to clipboard</text>
  <text class="ts" x="140" y="220" text-anchor="middle" dominant-baseline="central">Text lost on tab close</text>
</g>
<g class="c-teal">
  <rect x="490" y="176" width="140" height="64" rx="6" stroke-width="0.5"/>
  <text class="th" x="560" y="200" text-anchor="middle" dominant-baseline="central">Save</text>
  <text class="ts" x="560" y="220" text-anchor="middle" dominant-baseline="central">JSON, no image</text>
</g>

<line x1="40" y1="286" x2="450" y2="286" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="6 4"/>
<line x1="630" y1="286" x2="640" y2="286" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="6 4"/>
<g class="c-coral">
  <rect x="455" y="269" width="170" height="34" rx="17" stroke-width="0.5"/>
  <text class="th" x="540" y="288" text-anchor="middle" dominant-baseline="central">Trust boundary</text>
</g>

<line x1="560" y1="240" x2="560" y2="316" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="490" y="316" width="140" height="64" rx="6" stroke-width="0.5"/>
  <text class="th" x="560" y="340" text-anchor="middle" dominant-baseline="central">Backend</text>
  <text class="ts" x="560" y="360" text-anchor="middle" dominant-baseline="central">Persists text</text>
</g>
</svg>
